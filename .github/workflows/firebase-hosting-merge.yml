# This file was auto-generated by the Firebase CLI
# https://github.com/firebase/firebase-tools

name: Deploy website
'on':
  push:
    branches:
      - main
  workflow_dispatch:
permissions:
  contents: read
  checks: write
concurrency:
  group: firebase-hosting-live
  cancel-in-progress: false
jobs:
  build_and_deploy:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          NODE_OPTIONS: --max-old-space-size=4096
      - run: npm run build:pepicons.com
        env:
          NODE_OPTIONS: --max-old-space-size=4096
          NUXT_PUBLIC_POSTHOG_PUBLIC_KEY: '${{ vars.PEPICONS_POSTHOG_PUBLIC_KEY }}'
          NUXT_PUBLIC_POSTHOG_HOST: '${{ vars.PEPICONS_POSTHOG_HOST }}'
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_PEP_ICONS }}'
          channelId: live
          projectId: pep-icons
